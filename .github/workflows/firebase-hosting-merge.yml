name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - ko
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: prepare pnpm
        run: corepack enable pnpm
      - name: check env
        run: node -v && pnpm -v && export NODE_OPTIONS="--max_old_space_size=4096"
      - name: install dependencies
        run: pnpm i
      - name: build
        run: pnpm adev:build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGULAR_KO }}
          channelId: live
          projectId: angular-ko
