name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - ko
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: prepare pnpm
        run: corepack enable pnpm
      - name: check env
        run: node -v && pnpm -v
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: validate Firebase Hosting access
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGULAR_KO }}
        run: |
          # Keep credentials, CLI config, and any debug logs out of the checkout.
          set +x
          umask 077
          preflight_dir=''
          firebase_pid=''
          cleanup_preflight() {
            preflight_exit_code=$?
            trap - EXIT
            trap '' INT TERM
            if [[ -n "$firebase_pid" ]]; then
              kill "$firebase_pid" 2>/dev/null || true
              wait "$firebase_pid" 2>/dev/null || true
            fi
            if [[ -n "$preflight_dir" ]]; then
              rm -rf -- "$preflight_dir"
            fi
            exit "$preflight_exit_code"
          }
          trap cleanup_preflight EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          preflight_dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/firebase-preflight.XXXXXX")
          export GOOGLE_APPLICATION_CREDENTIALS="$preflight_dir/service-account.json"
          # Never print the JSON, parse errors, private key, or authentication responses.
          if ! node <<'NODE' >/dev/null 2>&1
          const fs = require('node:fs');
          const {createPrivateKey} = require('node:crypto');
          try {
            const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '');
            const fields = ['project_id', 'client_email', 'private_key', 'token_uri'];
            if (!account || typeof account !== 'object' || Array.isArray(account) ||
                account.type !== 'service_account' ||
                fields.some(field => typeof account[field] !== 'string' || !account[field].trim()) ||
                account.project_id !== 'angular-ko' ||
                !/^[^@\s]+@[^@\s]+\.gserviceaccount\.com$/.test(account.client_email) ||
                account.token_uri !== 'https://oauth2.googleapis.com/token' ||
                (account.universe_domain && account.universe_domain !== 'googleapis.com') ||
                createPrivateKey(account.private_key).asymmetricKeyType !== 'rsa') {
              process.exit(1);
            }
            fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, JSON.stringify(account), {
              mode: 0o600,
              flag: 'wx',
            });
          } catch {
            process.exit(1);
          }
          NODE
          then
            echo '::error::Firebase service-account JSON is invalid or does not match angular-ko.'
            exit 1
          fi
          unset FIREBASE_SERVICE_ACCOUNT FIREBASE_TOKEN

          # Reuse the repository's locked CLI; do not install another copy.
          firebase_cli=$(node -p "require.resolve('firebase-tools/lib/bin/firebase.js')")
          export HOME="$preflight_dir/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          cd "$preflight_dir"
          # This proves authentication and Hosting read access, not all deploy permissions.
          node "$firebase_cli" hosting:sites:list --project angular-ko --non-interactive >/dev/null 2>&1 &
          firebase_pid=$!
          preflight_exit_code=0
          wait "$firebase_pid" || preflight_exit_code=$?
          firebase_pid=''
          if [[ "$preflight_exit_code" -ne 0 ]]; then
            echo '::error::Firebase authentication or Hosting read access failed for angular-ko. Check the repository secret and project access.'
            exit "$preflight_exit_code"
          fi
          echo 'Firebase authentication and Hosting read access verified for angular-ko.'
      - name: prepare Bazel cache key
        id: bazel-cache-key
        env:
          BUILD_CONFIG_HASH: ${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'package.json', '.github/workflows/firebase-hosting-merge.yml') }}
        run: |
          # Cache only action outputs, never the checkout, HOME, or Firebase credentials.
          echo "BAZEL_DISK_CACHE=$RUNNER_TEMP/angular-ko-bazel-disk-cache" >> "$GITHUB_ENV"
          # Host tools are not all Bazel inputs. Do not reuse across runner image/tool changes.
          toolchain_hash=$(printf '%s\n' "$ImageOS" "$ImageVersion" "$(node --version)" | sha256sum | cut -d ' ' -f 1)
          prefix="bazel-disk-v1-${RUNNER_OS}-${RUNNER_ARCH}-${toolchain_hash}-${BUILD_CONFIG_HASH}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: restore Bazel action cache
        id: bazel-cache
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.bazel-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.bazel-cache-key.outputs.prefix }}-

      - name: prepare Bazel action cache
        env:
          RESTORE_OUTCOME: ${{ steps.bazel-cache.outcome }}
          CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
        run: |
          # A cache outage must not block a normal cold build or leave partial restored data.
          if [[ "$RESTORE_OUTCOME" != success || -z "$CACHE_MATCHED_KEY" ]]; then
            rm -rf -- "$BAZEL_DISK_CACHE"
          fi
          mkdir -p "$BAZEL_DISK_CACHE"

      - name: build
        id: build
        run: |
          resource_snapshot() {
            printf '\n--- Build resources: %s ---\n' "$(date -u +%FT%TZ)"
            free -m || true
            df -h . "${RUNNER_TEMP:-/tmp}" || true
            df -i . "${RUNNER_TEMP:-/tmp}" || true
            # Show executable names and usage only, never arguments or environment variables.
            ps -eo pid,ppid,comm,%cpu,%mem,rss --sort=-rss | head -n 11 || true
            if [[ -r /sys/fs/cgroup/memory.events ]]; then
              printf '%s\n' 'cgroup memory events:'
              cat /sys/fs/cgroup/memory.events || true
            fi
          }

          monitor_resources() {
            sleep_pid=''
            trap 'if [[ -n "$sleep_pid" ]]; then kill "$sleep_pid" 2>/dev/null || true; wait "$sleep_pid" 2>/dev/null || true; fi; exit 0' INT TERM
            while true; do
              sleep 30 &
              sleep_pid=$!
              wait "$sleep_pid" || break
              sleep_pid=''
              resource_snapshot || true
            done
          }

          finish_build() {
            build_exit_code=$?
            trap - EXIT
            trap '' INT TERM
            if [[ -n "$build_pid" ]]; then
              kill "$build_pid" 2>/dev/null || true
            fi
            if [[ -n "$monitor_pid" ]]; then
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true
            fi
            resource_snapshot || true
            printf '\nBuild step exit code: %s\n' "$build_exit_code" || true
            echo "elapsed-seconds=$SECONDS" >> "$GITHUB_OUTPUT" || true
            exit "$build_exit_code"
          }

          SECONDS=0
          build_pid=''
          monitor_pid=''
          trap finish_build EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Stream snapshots during the build: runner loss can prevent a final snapshot.
          resource_snapshot || true
          monitor_resources &
          monitor_pid=$!

          # Waiting on a background build lets cancellation run the cleanup trap promptly.
          # Use the same development target directly: adev:build is a local-only wrapper.
          # Do not retain one TypeScript worker per worker key through app bundling.
          # The memory resource budget guides scheduling; it is not an RSS hard limit.
          pnpm bazel build //adev:build \
            --disk_cache="$BAZEL_DISK_CACHE" \
            --jobs=2 \
            --local_resources=memory=6144 \
            --spawn_strategy=processwrapper-sandbox \
            --action_env=NG_BUILD_MAX_WORKERS=2 &
          build_pid=$!
          # Capture failures explicitly because GitHub Actions runs Bash with errexit.
          build_exit_code=0
          wait "$build_pid" || build_exit_code=$?
          build_pid=''
          exit "$build_exit_code"
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: report Bazel cache and build cost
        id: cache-report
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        env:
          CACHE_MATCHED_KEY: ${{ steps.bazel-cache.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.bazel-cache.outputs.cache-hit }}
          RESTORE_OUTCOME: ${{ steps.bazel-cache.outcome }}
          BUILD_SECONDS: ${{ steps.build.outputs.elapsed-seconds }}
        run: |
          cache_bytes=$(du -sb "$BAZEL_DISK_CACHE" | cut -f 1)
          {
            echo '### Bazel build cache'
            echo "- Restore outcome: $RESTORE_OUTCOME"
            echo "- Restored key: ${CACHE_MATCHED_KEY:-none (cold build)}"
            echo "- Exact archive key hit: ${CACHE_EXACT_HIT:-false}"
            echo "- Build step: ${BUILD_SECONDS:-unknown} seconds"
            echo "- Action cache size: $cache_bytes bytes"
            echo '- Bazel action cache hits are shown in the build log; an archive hit is not an action hit.'
            echo '- Compare total job time too: archive restore/save overhead can offset build savings.'
          } >> "$GITHUB_STEP_SUMMARY"
          # Bound archive transfer/storage. A large cache must not delay deployment indefinitely.
          if (( cache_bytes <= 8 * 1024 * 1024 * 1024 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Bazel disk cache exceeds 8 GiB; skipping cache upload. Review cache size before raising this limit.'
            echo '- Cache upload skipped: cache exceeds 8 GiB.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANGULAR_KO }}
          channelId: live
          projectId: angular-ko

      # Save only after successful build/deploy, and never overwrite an immutable exact match.
      # Keep optional cache upload after deployment so cache service errors cannot block publishing.
      - name: save Bazel action cache
        if: ${{ success() && steps.cache-report.outputs.save == 'true' && steps.bazel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.bazel-cache-key.outputs.key }}
