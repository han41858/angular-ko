<!-- #docregion -->
<div>
  <form (ngSubmit)="onSubmit()" [formGroup]="form()">
    @for (question of questions(); track question) {
      <div class="form-row">
        <app-question [question]="question" [form]="form()" />
      </div>
    }

    <div class="form-row">
      <button type="submit" [disabled]="!form().valid">저장</button>
    </div>
  </form>

  @if (payLoad) {
    <div class="form-row"><strong>다음 값을 저장했습니다</strong><br />{{ payLoad }}</div>
  }
</div>
