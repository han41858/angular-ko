<!-- #docregion v2, -->
<h1>첫 번째 어트리뷰트 디렉티브</h1>

<h2>강조 색상 선택</h2>
<div>
  <input type="radio" name="colors" (click)="color = 'lightgreen'" />초록색
  <input type="radio" name="colors" (click)="color = 'yellow'" />노란색
  <input type="radio" name="colors" (click)="color = 'cyan'" />청록색
</div>
<!-- #docregion color -->
<p [appHighlight]="color">강조해 보세요!</p>
<!-- #enddocregion color, v2 -->

<!-- #docregion defaultColor -->
<p [appHighlight]="color" defaultColor="violet">여기도 강조해 보세요!</p>
<!-- #enddocregion defaultColor, -->

<hr />
<h2>아래 문장 위에 마우스를 올려 고정된 강조 색상을 확인하세요</h2>

<p [appHighlight]="'yellow'">노란색으로 강조</p>
<p appHighlight="orange">주황색으로 강조</p>

<hr />

<h2>ngNonBindable</h2>
<!-- #docregion ngNonBindable -->
<p>ngNonBindable로 표현식 평가를 중지하세요.</p>
<p ngNonBindable>이 표현식은 평가되지 않아야 합니다: {{ 1 + 1 }}</p>
<!-- #enddocregion ngNonBindable -->

<!-- #docregion ngNonBindable-with-directive -->
<h3>디렉티브와 함께 사용하는 ngNonBindable</h3>
<div ngNonBindable [appHighlight]="'yellow'">
  이 표현식은 평가되지 않지만 노란색으로 강조됩니다: {{ 1 + 1 }}
</div>
<!-- #enddocregion ngNonBindable-with-directive -->
