<h1>접근성 예제</h1>
<!-- #docregion template -->
<label for="progress-value">
  진행률 예제 값 입력
  <input
    id="progress-value"
    type="number"
    min="0"
    max="100"
    [value]="progress"
    (input)="setProgress($event)"
  />
</label>

<!-- The user of the progressbar sets an aria-label to communicate what the progress means. -->
<app-example-progressbar [value]="progress" aria-label="진행률 표시줄 예제" />
<!-- #enddocregion template -->
