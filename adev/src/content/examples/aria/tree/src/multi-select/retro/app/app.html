<div class="win95-file-explorer">
  <div class="title-bar">
    <div class="title-bar-text">탐색 - (C:)</div>
    <div class="title-bar-controls">
      <button tabindex="-1" aria-label="최소화"><span>-</span></button>
      <button tabindex="-1" aria-label="최대화"><span>&#x25A1;</span></button>
      <button tabindex="-1" aria-label="닫기"><span>&#xd7;</span></button>
    </div>
  </div>

  <div class="menu-bar">
    <div class="menu-item">파일(<u>F</u>)</div>
    <div class="menu-item">편집(<u>E</u>)</div>
    <div class="menu-item">보기(<u>V</u>)</div>
    <div class="menu-item">도구(<u>T</u>)</div>
    <div class="menu-item">도움말(<u>H</u>)</div>
  </div>

  <div class="toolbar">
    <button tabindex="-1" class="win95-btn"><span class="icon">&#x2190;</span> 뒤로</button>
    <button tabindex="-1" class="win95-btn"><span class="icon">&#x2192;</span> 앞으로</button>
    <button tabindex="-1" class="win95-btn"><span class="icon">&#x2191;</span> 위로</button>
  </div>

  <div class="tree-view">
    <ul ngTree #tree="ngTree" class="retro-tree" [(value)]="selected" [multi]="true">
      <ng-template
        [ngTemplateOutlet]="treeNodes"
        [ngTemplateOutletContext]="{nodes: nodes, parent: tree}"
      />
    </ul>
  </div>

  <div class="status-bar">
    <div class="status-panel status-panel-grow">선택한 개체 {{ selectedCount() }}개</div>
    <div class="status-panel status-panel-right">4.5MB</div>
  </div>
</div>

<ng-template #treeNodes let-nodes="nodes" let-parent="parent">
  @for (node of nodes; track node.value) {
    <li
      ngTreeItem
      [parent]="parent"
      [value]="node.value"
      [label]="node.name"
      [(expanded)]="node.expanded"
      [disabled]="node.disabled"
      #treeItem="ngTreeItem"
    >
      <span aria-hidden="true">
        @if (node.children) {
          {{ treeItem.expanded() ? '📂' : '📁' }}
        } @else {
          📄
        }
      </span>
      {{ node.name }}
      <span aria-hidden="true" class="material-symbols-outlined selected-icon" translate="no"
        >check</span
      >
    </li>

    @if (node.children) {
      <ul role="group">
        <ng-template ngTreeItemGroup [ownedBy]="treeItem" #group="ngTreeItemGroup">
          <ng-template
            [ngTemplateOutlet]="treeNodes"
            [ngTemplateOutletContext]="{nodes: node.children, parent: group}"
          />
        </ng-template>
      </ul>
    }
  }
</ng-template>
