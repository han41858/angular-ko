<div ngToolbar dir="rtl" class="rtl-retro-toolbar" aria-label="텍스트 서식 도구">
  <div class="group">
    <button
      ngToolbarWidget
      value="undo"
      type="button"
      aria-label="실행 취소"
      class="material-symbols-outlined"
      translate="no"
    >
      undo
    </button>

    <button
      ngToolbarWidget
      value="redo"
      type="button"
      aria-label="다시 실행"
      class="material-symbols-outlined"
      translate="no"
    >
      redo
    </button>
  </div>

  <div class="separator" role="separator"></div>

  <div class="group">
    <button
      ngToolbarWidget
      value="bold"
      type="button"
      aria-label="굵게"
      class="material-symbols-outlined"
      [attr.aria-pressed]="bold()"
      (click)="bold.set(!bold())"
      translate="no"
    >
      format_bold
    </button>

    <button
      ngToolbarWidget
      value="italic"
      type="button"
      aria-label="기울임꼴"
      class="material-symbols-outlined"
      [attr.aria-pressed]="italic()"
      (click)="italic.set(!italic())"
      translate="no"
    >
      format_italic
    </button>

    <button
      ngToolbarWidget
      value="underlined"
      type="button"
      aria-label="밑줄"
      class="material-symbols-outlined"
      [attr.aria-pressed]="underlined()"
      (click)="underlined.set(!underlined())"
      translate="no"
    >
      format_underlined
    </button>
  </div>

  <div class="separator" role="separator"></div>

  <div ngToolbarWidgetGroup role="radiogroup" class="group" aria-label="텍스트 정렬 옵션">
    <button
      ngToolbarWidget
      role="radio"
      type="button"
      value="align left"
      aria-label="왼쪽 정렬"
      class="material-symbols-outlined"
      [attr.aria-checked]="alignment() === 'left'"
      (click)="alignment.set('left')"
      translate="no"
    >
      format_align_left
    </button>

    <button
      ngToolbarWidget
      role="radio"
      type="button"
      value="align center"
      aria-label="가운데 정렬"
      class="material-symbols-outlined"
      [attr.aria-checked]="alignment() === 'center'"
      (click)="alignment.set('center')"
      translate="no"
    >
      format_align_center
    </button>

    <button
      ngToolbarWidget
      role="radio"
      type="button"
      value="align right"
      aria-label="오른쪽 정렬"
      class="material-symbols-outlined"
      [attr.aria-checked]="alignment() === 'right'"
      (click)="alignment.set('right')"
      translate="no"
    >
      format_align_right
    </button>
  </div>
</div>
