<!-- #docplaster -->
<!-- #docregion final -->
<div class="container">
  <!-- #docregion edit-div -->
  <div [hidden]="submitted">
    <h1>배우 폼</h1>
    <!-- #docregion ngSubmit -->
    <form (ngSubmit)="onSubmit()" #actorForm="ngForm">
      <!-- #enddocregion ngSubmit, edit-div -->
      <div class="form-group">
        <!-- #docregion name-with-error-msg -->
        <label for="name">이름</label>
        <input
          type="text"
          class="form-control"
          id="name"
          required
          [(ngModel)]="model.name"
          name="name"
          #name="ngModel"
        />
        <!-- #docregion hidden-error-msg -->
        <div [hidden]="name.valid || name.pristine" class="alert alert-danger">
          <!-- #enddocregion hidden-error-msg -->
          이름은 필수입니다
        </div>
        <!-- #enddocregion name-with-error-msg -->
      </div>

      <div class="form-group">
        <label for="studio">소속 스튜디오</label>
        <input
          type="text"
          class="form-control"
          id="studio"
          [(ngModel)]="model.studio"
          name="studio"
        />
      </div>

      <div class="form-group">
        <label for="skill">특기</label>
        <select
          class="form-control"
          id="skill"
          required
          [(ngModel)]="model.skill"
          name="skill"
          #skill="ngModel"
        >
          @for (skill of skills; track $index) {
            <option [value]="skill">{{ skill }}</option>
          }
        </select>
        <div [hidden]="skill.valid || skill.pristine" class="alert alert-danger">
          특기는 필수입니다
        </div>
      </div>

      <!-- #docregion submit-button -->
      <button type="submit" class="btn btn-success" [disabled]="!actorForm.form.valid">제출</button>
      <!-- #enddocregion submit-button -->
      <!-- #docregion new-actor-button-form-reset -->
      <button type="button" class="btn btn-default" (click)="newActor(); actorForm.reset()">
        새 배우
      </button>
      <!-- #enddocregion new-actor-button-form-reset -->
      <!-- #enddocregion final -->
      <em>초기화</em> 실행 &nbsp;&nbsp;
      <!-- #docregion new-actor-button-no-reset -->
      <button type="button" class="btn btn-default" (click)="newActor()">새 배우</button>
      <!-- #enddocregion new-actor-button-no-reset -->
      <em>초기화 없이</em> 실행

      <!-- NOT SHOWN IN DOCS -->
      <div>
        <hr />
        form.controls로 조회한 이름 = {{ showFormControls(actorForm) }}
      </div>
      <!-- - -->
      <!-- #docregion final -->
    </form>
  </div>

  <!-- #docregion submitted -->
  <div [hidden]="!submitted">
    <h2>다음 내용을 제출했습니다:</h2>
    <div class="row">
      <div class="col-xs-3">이름</div>
      <div class="col-xs-9">{{ model.name }}</div>
    </div>
    <div class="row">
      <div class="col-xs-3">스튜디오</div>
      <div class="col-xs-9">{{ model.studio }}</div>
    </div>
    <div class="row">
      <div class="col-xs-3">특기</div>
      <div class="col-xs-9">{{ model.skill }}</div>
    </div>
    <br />
    <button type="button" class="btn btn-primary" (click)="submitted = false">편집</button>
  </div>
  <!-- #enddocregion submitted -->
</div>
<!-- #enddocregion final -->
